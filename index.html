<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlockJump — игра для Android</title>
<meta name="description" content="BlockJump — строй путь из блоков и беги от лавы! Игра для Android в RuStore.">
<style>
  :root{--bg:#1b0f3a;--card:#2a1858;--pink:#ff6fa5;--yellow:#ffd23f;--text:#f4efff}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,#7a3fe0,#ff6fa5);color:var(--text);min-height:100vh}
  main{max-width:720px;margin:0 auto;padding:48px 16px;text-align:center}
  img{width:160px;height:160px;border-radius:36px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  h1{font-size:44px;margin:24px 0 8px;color:#fff;text-shadow:0 4px 0 #3b2463}
  p{font-size:18px;line-height:1.5}
  .btn{display:inline-block;margin:24px 0;padding:16px 32px;border-radius:999px;background:var(--yellow);color:#3b2463;font-weight:800;text-decoration:none;font-size:20px;box-shadow:0 6px 0 #c99a00}
  .card{background:rgba(27,15,58,.55);border-radius:24px;padding:20px;margin-top:24px;text-align:left}
  a{color:#fff}
  footer{margin-top:40px;font-size:14px;opacity:.85}
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="Иконка BlockJump">
  <h1>BlockJump</h1>
  <p>Строй путь из блоков — герой бежит сам. Беги от лавы, собирай ряды, взрывай бомбы и прыгай на пружинах!</p>
  <a class="btn" href="https://www.rustore.ru/catalog/app/ru.blockjump.game">Скачать в RuStore</a>
  <div class="card">
    <p><b>Разработчик:</b> D3mPle</p>
  </div>
  <footer>© 2026 D3mPle · BlockJump</footer>
</main>
</body>
</html>
